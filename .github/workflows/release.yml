# Publishes one package with provenance, using trusted publishing (OIDC): no tokens are stored anywhere.
# npm: the package's trusted publisher is this repo and this workflow. PyPI: the same, as a pending publisher.
name: Release
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options: [human-js, human-py]
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    if: inputs.package != 'human-py'
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: packages/${{ inputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
  pypi:
    if: inputs.package == 'human-py'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography build
      - run: python -m unittest discover -s tests -v
        working-directory: packages/human-py
      - run: python -m build --outdir dist packages/human-py
      - uses: pypa/gh-action-pypi-publish@release/v1
