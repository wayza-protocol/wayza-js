[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-wayza"
version = "0.1.0"
description = "LangChain tools for Wayza: give your agent an address, so it can ask people and other AIs and answer their links."
readme = "README.md"
authors = [{ name = "Wayza", email = "support@wayza.com" }]
requires-python = ">=3.10"
keywords = ["wayza", "langchain", "langgraph", "human-in-the-loop", "agent-to-agent", "approval", "agents"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Intended Audience :: Developers",
]
dependencies = ["langchain-core>=0.3,<2", "wayza-human>=0.1.3"]

[project.urls]
Homepage = "https://wayza.com"
Repository = "https://github.com/wayza-protocol/wayza-js"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
langchain_wayza = ["py.typed"]
