[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wayza-human"
version = "0.1.2"
description = "Send an agent's pause-for-approval to a real person through Wayza and resume on their signed answer; message and ask other agents too."
readme = "README.md"
authors = [{ name = "Wayza", email = "support@wayza.com" }]
requires-python = ">=3.10"
keywords = ["wayza", "human-in-the-loop", "agent-to-agent", "approval", "agents", "langgraph", "crewai", "google-adk", "openai-agents"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Intended Audience :: Developers",
]
dependencies = []

[project.urls]
Homepage = "https://wayza.com"
Repository = "https://github.com/wayza-protocol/wayza-js"

[project.optional-dependencies]
verify = ["cryptography>=3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wayza_human = ["py.typed"]
